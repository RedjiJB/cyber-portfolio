<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Security layers</title><desc id="d">From the internet to a service: Cloudflare edge, Access, tunnel, Traefik, Authentik, the app and its database.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="32" text-anchor="start" font-size="20" font-weight="700" fill="#1a202c">Defence in depth: what stands between the internet and a service</text>
<rect x="40" y="100" width="180" height="90" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="1.6"/>
<text x="130" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Cloudflare edge</text>
<text x="130" y="138" text-anchor="middle" font-size="11" fill="#4a5568">TLS, DDoS, WAF</text>
<rect x="235" y="100" width="180" height="90" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="1.6"/>
<text x="325" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Cloudflare Access</text>
<text x="325" y="138" text-anchor="middle" font-size="11" fill="#4a5568">e-mail PIN, allow-list</text>
<text x="325" y="152" text-anchor="middle" font-size="11" fill="#4a5568">24 h session</text>
<rect x="430" y="100" width="180" height="90" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="1.6"/>
<text x="520" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Tunnel + cloudflared</text>
<text x="520" y="138" text-anchor="middle" font-size="11" fill="#4a5568">outbound only</text>
<text x="520" y="152" text-anchor="middle" font-size="11" fill="#4a5568">no inbound port</text>
<rect x="625" y="100" width="180" height="90" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="715" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Traefik (VM)</text>
<text x="715" y="138" text-anchor="middle" font-size="11" fill="#4a5568">Host routing</text>
<text x="715" y="152" text-anchor="middle" font-size="11" fill="#4a5568">no published DB ports</text>
<rect x="820" y="100" width="180" height="90" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="910" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Authentik + app</text>
<text x="910" y="138" text-anchor="middle" font-size="11" fill="#4a5568">SSO, MFA, roles,</text>
<text x="910" y="152" text-anchor="middle" font-size="11" fill="#4a5568">app permissions</text>
<line x1="220" y1="145" x2="235" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="415" y1="145" x2="430" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="610" y1="145" x2="625" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="805" y1="145" x2="820" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="240" width="1000" height="70" rx="8" fill="#fff0f0" stroke="#c53030" stroke-width="1.6"/>
<text x="540" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Bypass (narrow, on purpose)</text>
<text x="540" y="278" text-anchor="middle" font-size="11" fill="#4a5568">auth.example.org/application/o/*  (OIDC discovery, token, userinfo, JWKS) skips Access so Nextcloud, Zammad, Odoo and Vault can talk to Authentik; those calls need a client secret or bearer token.</text>
<rect x="40" y="340" width="480" height="110" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="280" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Not exposed to the internet at all</text>
<text x="280" y="378" text-anchor="middle" font-size="11" fill="#4a5568">SSH (Oracle VMs: tailnet only)</text>
<text x="280" y="392" text-anchor="middle" font-size="11" fill="#4a5568">Vaultwarden (tailnet only, Serve)</text>
<text x="280" y="406" text-anchor="middle" font-size="11" fill="#4a5568">Postgres/Redis/Elasticsearch (container network)</text>
<text x="280" y="420" text-anchor="middle" font-size="11" fill="#4a5568">Vault unseal key (kept offline)</text>
<rect x="560" y="340" width="480" height="110" rx="8" fill="#fff0f0" stroke="#c53030" stroke-width="1.6"/>
<text x="800" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Controls you operate</text>
<text x="800" y="378" text-anchor="middle" font-size="11" fill="#4a5568">Access allow-list (3 e-mail addresses)</text>
<text x="800" y="392" text-anchor="middle" font-size="11" fill="#4a5568">Authentik MFA (TOTP) + group `authentik Admins`</text>
<text x="800" y="406" text-anchor="middle" font-size="11" fill="#4a5568">Tailscale ACL / device approval</text>
<text x="800" y="420" text-anchor="middle" font-size="11" fill="#4a5568">Paper emergency sheet + offline export</text>
</svg>
