<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 470" width="1150" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Monitoring chain</title><desc id="d">Uptime Kuma on the Pi checks services and sends alerts to ntfy; backups report to ntfy and a Kuma push monitor; Oracle VM2 checks from outside.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="32" text-anchor="start" font-size="20" font-weight="700" fill="#1a202c">Monitoring and alerting</text>
<rect x="40" y="100" width="200" height="80" rx="8" fill="#e8f7ee" stroke="#2f855a" stroke-width="1.6"/>
<text x="140" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Uptime Kuma (Pi)</text>
<text x="140" y="138" text-anchor="middle" font-size="11" fill="#4a5568">28 monitors from git</text>
<text x="140" y="152" text-anchor="middle" font-size="11" fill="#4a5568">maintenance windows</text>
<rect x="330" y="100" width="200" height="80" rx="8" fill="#e8f7ee" stroke="#2f855a" stroke-width="1.6"/>
<text x="430" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">ntfy (Pi)</text>
<text x="430" y="138" text-anchor="middle" font-size="11" fill="#4a5568">private topic</text>
<text x="430" y="152" text-anchor="middle" font-size="11" fill="#4a5568">phone push</text>
<rect x="620" y="100" width="200" height="80" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="720" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">You</text>
<text x="720" y="138" text-anchor="middle" font-size="11" fill="#4a5568">phone / ntfy app</text>
<line x1="240" y1="140" x2="330" y2="140" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="285" y="135" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">down/up</text>
<line x1="530" y1="140" x2="620" y2="140" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="40" y="240" width="200" height="80" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="140" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Services checked</text>
<text x="140" y="278" text-anchor="middle" font-size="11" fill="#4a5568">Pi, Machine B, repeater,</text>
<text x="140" y="292" text-anchor="middle" font-size="11" fill="#4a5568">site, FieldOps, mail,</text>
<text x="140" y="306" text-anchor="middle" font-size="11" fill="#4a5568">Oracle SSH, IT stack x5</text>
<line x1="140" y1="240" x2="140" y2="180" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="140" y="205" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">probe</text>
<rect x="330" y="240" width="200" height="80" rx="8" fill="#fff5e6" stroke="#c05621" stroke-width="1.6"/>
<text x="430" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Backup run (Machine B)</text>
<text x="430" y="278" text-anchor="middle" font-size="11" fill="#4a5568">ntfy message +</text>
<text x="430" y="292" text-anchor="middle" font-size="11" fill="#4a5568">Kuma push heartbeat</text>
<line x1="430" y1="240" x2="430" y2="180" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="430" y="205" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">result</text>
<line x1="530" y1="280" x2="240" y2="150" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="385" y="210" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">push URL</text>
<rect x="620" y="240" width="200" height="80" rx="8" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.6"/>
<text x="720" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Oracle VM2 timer</text>
<text x="720" y="278" text-anchor="middle" font-size="11" fill="#4a5568">external uptime check</text>
<text x="720" y="292" text-anchor="middle" font-size="11" fill="#4a5568">of the public site</text>
<line x1="720" y1="240" x2="440" y2="150" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="580" y="190" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">ntfy (if reachable)</text>
<rect x="40" y="360" width="1050" height="70" rx="8" fill="#fff0f0" stroke="#c53030" stroke-width="1.6"/>
<text x="565" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Gaps to know</text>
<text x="565" y="398" text-anchor="middle" font-size="11" fill="#4a5568">If the Pi is down Kuma is down too (the Oracle check is the backstop). IT-stack monitors are silenced by the off-hours maintenance windows. Vaultwarden has no monitor yet.</text>
</svg>
