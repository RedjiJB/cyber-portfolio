<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Field operations platform architecture</title><desc id="d">Managers use a web dashboard and crews use WhatsApp. Both reach one TypeScript domain layer on a cloud VM, through a REST facade and an MCP server, backed by PostgreSQL.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="32" text-anchor="start" font-size="20" font-weight="700" fill="#1a202c">Field operations platform: system architecture</text>
<rect x="20" y="60" width="200" height="580" rx="12" fill="#eef6ff" fill-opacity="0.45" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32" y="78" font-size="12" font-weight="700" fill="#2b6cb0">People</text>
<rect x="40" y="130" width="160" height="74" rx="8" fill="#eef6ff" stroke="#2b6cb0" stroke-width="1.6"/>
<text x="120" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Managers</text>
<text x="120" y="168" text-anchor="middle" font-size="11" fill="#4a5568">web dashboard</text>
<text x="120" y="182" text-anchor="middle" font-size="11" fill="#4a5568">in a browser</text>
<rect x="250" y="60" width="170" height="580" rx="12" fill="#fff7e0" fill-opacity="0.45" stroke="#b7791f" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="262" y="78" font-size="12" font-weight="700" fill="#b7791f">Edge</text>
<rect x="265" y="130" width="140" height="74" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="1.6"/>
<text x="335" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Cloudflare</text>
<text x="335" y="168" text-anchor="middle" font-size="11" fill="#4a5568">DNS proxy</text>
<text x="335" y="182" text-anchor="middle" font-size="11" fill="#4a5568">full-strict TLS</text>
<rect x="450" y="60" width="470" height="580" rx="12" fill="#fdf2f8" fill-opacity="0.45" stroke="#b83280" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="462" y="78" font-size="12" font-weight="700" fill="#b83280">Application server (small cloud VM)</text>
<rect x="480" y="100" width="410" height="62" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="685" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Caddy</text>
<text x="685" y="138" text-anchor="middle" font-size="11" fill="#4a5568">reverse proxy · origin certificate · serves the dashboard files</text>
<rect x="480" y="200" width="190" height="80" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="575" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">REST facade</text>
<text x="575" y="238" text-anchor="middle" font-size="11" fill="#4a5568">login rate limit · lockout</text>
<text x="575" y="252" text-anchor="middle" font-size="11" fill="#4a5568">TOTP multi-factor for admins</text>
<rect x="700" y="200" width="190" height="80" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="795" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">MCP server</text>
<text x="795" y="238" text-anchor="middle" font-size="11" fill="#4a5568">typed tools · capability check</text>
<text x="795" y="252" text-anchor="middle" font-size="11" fill="#4a5568">confirm-before-execute</text>
<rect x="480" y="330" width="410" height="88" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="685" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Domain layer (TypeScript)</text>
<text x="685" y="368" text-anchor="middle" font-size="11" fill="#4a5568">crew · jobs · sites · equipment · inventory</text>
<text x="685" y="382" text-anchor="middle" font-size="11" fill="#4a5568">timeclock · procurement · payroll · alerts</text>
<rect x="480" y="470" width="190" height="76" rx="8" fill="#f7f7f7" stroke="#718096" stroke-width="1.6"/>
<text x="575" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Sovereignty policy</text>
<text x="575" y="508" text-anchor="middle" font-size="11" fill="#4a5568">which functions may call</text>
<text x="575" y="522" text-anchor="middle" font-size="11" fill="#4a5568">external services</text>
<rect x="700" y="470" width="190" height="76" rx="8" fill="#fff5e6" stroke="#c05621" stroke-width="1.6"/>
<text x="795" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">PostgreSQL</text>
<text x="795" y="508" text-anchor="middle" font-size="11" fill="#4a5568">container · ordered migrations</text>
<rect x="950" y="60" width="230" height="580" rx="12" fill="#f3f0ff" fill-opacity="0.45" stroke="#6b46c1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="962" y="78" font-size="12" font-weight="700" fill="#6b46c1">Outside services</text>
<rect x="970" y="100" width="190" height="60" rx="8" fill="#eef6ff" stroke="#2b6cb0" stroke-width="1.6"/>
<text x="1065" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Crews</text>
<text x="1065" y="138" text-anchor="middle" font-size="11" fill="#4a5568">WhatsApp on their phones</text>
<rect x="970" y="210" width="190" height="76" rx="8" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.6"/>
<text x="1065" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">WhatsApp gateway</text>
<text x="1065" y="248" text-anchor="middle" font-size="11" fill="#4a5568">one service credential,</text>
<text x="1065" y="262" text-anchor="middle" font-size="11" fill="#4a5568">limited to tier 2</text>
<rect x="970" y="340" width="190" height="66" rx="8" fill="#f7f7f7" stroke="#718096" stroke-width="1.6"/>
<text x="1065" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">LLM providers</text>
<text x="1065" y="378" text-anchor="middle" font-size="11" fill="#4a5568">external · chosen by policy</text>
<text x="1065" y="392" text-anchor="middle" font-size="11" fill="#4a5568">with fallbacks</text>
<rect x="970" y="470" width="190" height="76" rx="8" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.6"/>
<text x="1065" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Object Storage</text>
<text x="1065" y="508" text-anchor="middle" font-size="11" fill="#4a5568">nightly database backups</text>
<line x1="200" y1="167" x2="265" y2="167" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="232" y="162" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="3">HTTPS</text>
<line x1="405" y1="167" x2="480" y2="140" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="575" y1="162" x2="575" y2="200" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="575" y1="280" x2="575" y2="330" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="795" y1="280" x2="795" y2="330" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="795" y1="418" x2="795" y2="470" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="670" y1="508" x2="700" y2="508" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="685" y="481" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="3">policy table</text>
<line x1="1065" y1="160" x2="1065" y2="210" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1065" y="180" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="3">messages</text>
<line x1="970" y1="248" x2="890" y2="248" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="930" y="235" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="3">tool calls (HTTPS)</text>
<line x1="1065" y1="286" x2="1065" y2="340" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1065" y="308" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="3">prompts</text>
<line x1="890" y1="508" x2="970" y2="508" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="930" y="503" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="3">nightly dump</text>
<text x="24" y="656" text-anchor="start" font-size="11" font-weight="400" fill="#4a5568">Simplified. The dashboard is an open-source construction-ERP frontend, pruned to the modules the business uses.</text>
</svg>
