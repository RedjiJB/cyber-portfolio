<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Mail flow</title><desc id="d">Inbound mail via Cloudflare Email Routing and a Worker to a bridge on Oracle VM2 and Stalwart; outbound relayed through SMTP2GO; Roundcube webmail behind Access.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="32" text-anchor="start" font-size="20" font-weight="700" fill="#1a202c">Mail: example.org (Stalwart on Oracle VM2)</text>
<rect x="24" y="100" width="150" height="60" rx="8" fill="#f7f7f7" stroke="#718096" stroke-width="1.6"/>
<text x="99" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Sender</text>
<text x="99" y="138" text-anchor="middle" font-size="11" fill="#4a5568">any mail server</text>
<rect x="230" y="100" width="190" height="60" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="1.6"/>
<text x="325" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Cloudflare Email Routing</text>
<text x="325" y="138" text-anchor="middle" font-size="11" fill="#4a5568">MX route1/2/3.mx.cloudflare.net</text>
<rect x="470" y="100" width="170" height="60" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="1.6"/>
<text x="555" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Email Worker</text>
<text x="555" y="138" text-anchor="middle" font-size="11" fill="#4a5568">POSTs the message</text>
<rect x="700" y="100" width="190" height="60" rx="8" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.6"/>
<text x="795" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">inbound-bridge (VM2)</text>
<text x="795" y="138" text-anchor="middle" font-size="11" fill="#4a5568">adds PROXY header with real IP</text>
<text x="795" y="152" text-anchor="middle" font-size="11" fill="#4a5568">-&gt; Stalwart :2525</text>
<rect x="950" y="100" width="210" height="60" rx="8" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.6"/>
<text x="1055" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Stalwart v0.16</text>
<text x="1055" y="138" text-anchor="middle" font-size="11" fill="#4a5568">mailboxes, spam filter, queue</text>
<line x1="174" y1="130" x2="230" y2="130" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="202" y="125" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">SMTP 25</text>
<line x1="420" y1="130" x2="470" y2="130" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="640" y1="130" x2="700" y2="130" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="670" y="125" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">https</text>
<line x1="890" y1="130" x2="950" y2="130" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="950" y="260" width="210" height="60" rx="8" fill="#f7f7f7" stroke="#718096" stroke-width="1.6"/>
<text x="1055" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">SMTP2GO relay</text>
<text x="1055" y="298" text-anchor="middle" font-size="11" fill="#4a5568">outbound only</text>
<line x1="1055" y1="160" x2="1055" y2="260" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1100" y="205" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">outbound mail</text>
<rect x="24" y="260" width="150" height="60" rx="8" fill="#f7f7f7" stroke="#718096" stroke-width="1.6"/>
<text x="99" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Recipient</text>
<line x1="950" y1="290" x2="174" y2="290" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="562" y="285" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">delivered with SPF/DKIM</text>
<rect x="470" y="380" width="200" height="60" rx="8" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.6"/>
<text x="570" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Roundcube webmail</text>
<text x="570" y="418" text-anchor="middle" font-size="11" fill="#4a5568">webmail.example.org</text>
<text x="570" y="432" text-anchor="middle" font-size="11" fill="#4a5568">behind Cloudflare Access</text>
<rect x="730" y="380" width="200" height="60" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="830" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Mail clients</text>
<text x="830" y="418" text-anchor="middle" font-size="11" fill="#4a5568">IMAPS 993, submission 465</text>
<text x="830" y="432" text-anchor="middle" font-size="11" fill="#4a5568">direct to VM2</text>
<line x1="930" y1="410" x2="1055" y2="320" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="670" y1="410" x2="950" y2="150" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="780" y="315" text-anchor="middle" font-size="11" fill="#4a5568" paint-order="stroke" stroke="#fff" stroke-width="4">JMAP/IMAP internal</text>
<text x="24" y="490" text-anchor="start" font-size="11" font-weight="400" fill="#4a5568">Oracle blocks inbound 25 at its public edge, which is why inbound takes the Worker/bridge path over HTTPS. SSH to VM2 is tailnet-only.</text>
</svg>
