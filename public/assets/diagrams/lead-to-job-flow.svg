<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How a customer becomes a job</title><desc id="d">A visitor finds the website, sends the quote form; the lead is stored, e-mailed, alerted and tracked until it becomes a quote and a job.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="32" text-anchor="start" font-size="20" font-weight="700" fill="#1a202c">Lead to job: what happens when someone asks for a quote</text>
<rect x="24" y="100" width="156" height="90" rx="8" fill="#f7f7f7" stroke="#718096" stroke-width="1.6"/>
<text x="102" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Search / map</text>
<text x="102" y="138" text-anchor="middle" font-size="11" fill="#4a5568">finds The Sod Boys</text>
<rect x="192" y="100" width="156" height="90" rx="8" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.6"/>
<text x="270" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Website</text>
<text x="270" y="138" text-anchor="middle" font-size="11" fill="#4a5568">fast local pages</text>
<text x="270" y="152" text-anchor="middle" font-size="11" fill="#4a5568">(www.thesodboys.ca)</text>
<line x1="180" y1="145" x2="192" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="360" y="100" width="156" height="90" rx="8" fill="#e8f7ee" stroke="#2f855a" stroke-width="1.6"/>
<text x="438" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Quote form</text>
<text x="438" y="138" text-anchor="middle" font-size="11" fill="#4a5568">validates, stores</text>
<text x="438" y="152" text-anchor="middle" font-size="11" fill="#4a5568">the lead first</text>
<line x1="348" y1="145" x2="360" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="528" y="100" width="156" height="90" rx="8" fill="#e8f7ee" stroke="#2f855a" stroke-width="1.6"/>
<text x="606" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">E-mail + alert</text>
<text x="606" y="138" text-anchor="middle" font-size="11" fill="#4a5568">info@ inbox,</text>
<text x="606" y="152" text-anchor="middle" font-size="11" fill="#4a5568">ntfy push</text>
<line x1="516" y1="145" x2="528" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="696" y="100" width="156" height="90" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="774" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Zammad ticket</text>
<text x="774" y="138" text-anchor="middle" font-size="11" fill="#4a5568">next step: reply</text>
<text x="774" y="152" text-anchor="middle" font-size="11" fill="#4a5568">within 1 business day</text>
<line x1="684" y1="145" x2="696" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="864" y="100" width="156" height="90" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="942" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Odoo quote</text>
<text x="942" y="138" text-anchor="middle" font-size="11" fill="#4a5568">CRM, sale, invoice</text>
<line x1="852" y1="145" x2="864" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="1032" y="100" width="156" height="90" rx="8" fill="#e8f7ee" stroke="#2f855a" stroke-width="1.6"/>
<text x="1110" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">FieldOps job</text>
<text x="1110" y="138" text-anchor="middle" font-size="11" fill="#4a5568">work order,</text>
<text x="1110" y="152" text-anchor="middle" font-size="11" fill="#4a5568">WhatsApp</text>
<line x1="1020" y1="145" x2="1032" y2="145" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="24" y="240" width="1150" height="70" rx="8" fill="#fff0f0" stroke="#c53030" stroke-width="1.6"/>
<text x="599" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Today / not yet</text>
<text x="599" y="278" text-anchor="middle" font-size="11" fill="#4a5568">Live now: website (staging), form, e-mail, FieldOps crew flows. Not yet connected: form -&gt; Zammad ticket and Odoo lead (needs a small integration), Google Business Profile, analytics, review requests.</text>
<rect x="24" y="330" width="1150" height="60" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
<text x="599" y="354" text-anchor="middle" font-size="13" font-weight="400" fill="#1a202c">Why it matters</text>
<text x="599" y="368" text-anchor="middle" font-size="11" fill="#4a5568">Every step you own is a step you can measure and improve; each lead that bounces, goes unanswered or is lost between tools is revenue lost.</text>
</svg>
