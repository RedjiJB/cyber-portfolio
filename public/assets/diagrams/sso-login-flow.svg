<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">SSO login flow</title><desc id="d">A browser logs in to Nextcloud through Authentik; Nextcloud's server calls Authentik's token endpoint through the Access bypass.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="32" text-anchor="start" font-size="20" font-weight="700" fill="#1a202c">Single sign-on (OIDC authorization-code flow): Nextcloud / Zammad / Vault / Odoo</text>
<rect x="60" y="70" width="170" height="44" rx="8" fill="#f7f7f7" stroke="#718096" stroke-width="1.6"/>
<text x="145" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Browser</text>
<rect x="363" y="70" width="170" height="44" rx="8" fill="#fff7e0" stroke="#b7791f" stroke-width="1.6"/>
<text x="448" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Cloudflare Access</text>
<rect x="666" y="70" width="170" height="44" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="751" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Nextcloud</text>
<rect x="969" y="70" width="170" height="44" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.6"/>
<text x="1054" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Authentik</text>
<line x1="145" y1="114" x2="145" y2="504" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="448" y1="114" x2="448" y2="504" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="751" y1="114" x2="751" y2="504" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1054" y1="114" x2="1054" y2="504" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="151" y="138" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">1. open cloud.example.org (e-mail PIN, once per 24 h)</text>
<line x1="145" y1="144" x2="448" y2="144" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="454" y="178" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">2. request passes the tunnel + Traefik</text>
<line x1="448" y1="184" x2="751" y2="184" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="151" y="218" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">3. 302 to auth.../application/o/authorize/ (client id, redirect)</text>
<line x1="751" y1="224" x2="145" y2="224" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="151" y="258" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">4. authorize + log in (password, TOTP) - UI behind Access</text>
<line x1="145" y1="264" x2="1054" y2="264" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="151" y="298" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">5. 302 back to Nextcloud with a one-time code</text>
<line x1="1054" y1="304" x2="145" y2="304" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="151" y="338" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">6. GET /apps/user_oidc/code?code=...</text>
<line x1="145" y1="344" x2="751" y2="344" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="757" y="378" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">7. POST /application/o/token/ (client secret) - Access BYPASS path</text>
<line x1="751" y1="384" x2="1054" y2="384" stroke="#4a5568" stroke-width="1.8" marker-end="url(#a)"/>
<text x="757" y="418" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">8. ID token (sub = e-mail, preferred_username, groups)</text>
<line x1="1054" y1="424" x2="751" y2="424" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="151" y="458" text-anchor="start" font-size="11" font-weight="400" fill="#1a202c">9. session cookie: signed in</text>
<line x1="751" y1="464" x2="145" y2="464" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="60" y="524" width="1080" height="56" rx="8" fill="#fff0f0" stroke="#c53030" stroke-width="1.6"/>
<text x="600" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Why two gates?</text>
<text x="600" y="562" text-anchor="middle" font-size="11" fill="#4a5568">Cloudflare Access protects the web pages (people). Only /application/o/* is bypassed so the apps can reach Authentik's protocol endpoints; Authentik then authenticates the person.</text>
</svg>
