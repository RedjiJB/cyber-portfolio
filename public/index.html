        <style>
            /* Paint something immediately instead of a blank page while the JS bundle loads */
            #root:empty::before {
                content: "";
                position: fixed;
                top: 50%;
                left: 50%;
                width: 36px;
                height: 36px;
                margin: -18px 0 0 -18px;
                border: 3px solid rgba(128, 128, 128, 0.25);
                border-top-color: #00b4d8;
                border-radius: 50%;
                animation: root-spin 0.8s linear infinite;
            }
            @keyframes root-spin { to { transform: rotate(360deg); } }
        </style>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.13.0/css/all.min.css"
        />
